<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escuchar Nota de Voz</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 480px; margin: 40px auto; padding: 20px; background: #f5f7fa; color: #222; text-align: center; }
  .card { background: white; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); display: inline-block; width: 100%; }
  h1 { color: #2c3e50; margin: 0 0 8px 0; font-size: 22px; }
  .info { color: #555; font-size: 14px; margin-bottom: 20px; min-height: 24px; }
  audio { width: 100%; margin-top: 10px; }
  .error { color: #e74c3c; margin-top: 16px; font-size: 14px; }
  .hidden { display: none; }
  .hint { font-size: 12px; color: #999; margin-top: 20px; }
  .btn { display: inline-block; margin-top: 12px; padding: 10px 20px; background: #3498db; color: white; text-decoration: none; border-radius: 6px; font-weight: 600; }
  .btn:hover { background: #2980b9; }
</style>
</head>
<body>

<div class="card">
  <h1>🎧 Nota de Voz del Alumno</h1>
  <div class="info" id="info">Cargando audio...</div>
  <audio id="audioPlayer" controls preload="metadata" crossorigin="anonymous"></audio>
  <div id="error" class="error hidden"></div>
  <a id="btnDownload" class="btn hidden" target="_blank">Descargar audio</a>
  <p class="hint">Cada QR reproduce solo la grabación de su alumno correspondiente.</p>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const fileId = params.get('id');
const infoEl = document.getElementById('info');
const audioEl = document.getElementById('audioPlayer');
const errorEl = document.getElementById('error');
const btnDownload = document.getElementById('btnDownload');

if (!fileId) {
  infoEl.textContent = 'No se especificó ningún audio.';
  errorEl.textContent = 'Falta el ID del archivo en el enlace.';
  errorEl.classList.remove('hidden');
} else {
  // Intento 1: enlace directo de descarga de Drive
  audioEl.src = `https://drive.google.com/uc?export=download&id=${fileId}`;
  infoEl.textContent = 'Reproduciendo nota de voz...';

  audioEl.onerror = () => {
    // Intento 2: si falla, ofrecer descarga directa o abrir en Drive
    errorEl.textContent = 'No se pudo reproducir directamente desde este navegador.';
    errorEl.classList.remove('hidden');
    btnDownload.href = `https://drive.google.com/uc?export=download&id=${fileId}`;
    btnDownload.classList.remove('hidden');
    btnDownload.textContent = 'Descargar archivo de audio';
  };
}
</script>

</body>
</html>
